[package]
name = "rs_jwt_microservice"
version = "0.1.0"
edition = "2024"
description = "A production-ready REST API microservice template built with Rust's Actix Web framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jvcByte/rs_jwt_microservice"
authors = ["jvcByte <jvc8463@gmail.com>"]

[dependencies]
# Web Framework
actix-cors = "0.7.1"
actix-web = "4.14.0"

# Database
entity = {path = "../database/entity"}
migration = {path = "../database/migration"}
sea-orm = "2.0.0"

# Serialization
serde = "1.0.229"
serde_json = "1.0.151"

# UUID support
uuid = { version = "1.24.0", features = ["v4"] }

# Password hashing
argon2 = "0.5.3"

# Constant-time comparison (prevents timing attacks)
subtle = "2.6.1"

# Fast token hashing (for refresh token storage)
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"

# JWT
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }

# Time handling
chrono = "0.4.45"

# Async runtime
tokio = "1.53.1"
futures = "0.3.33"

# Environment variables
dotenvy = "0.15.7"

# Logging
log = "0.4.33"
env_logger = "0.11.11"
